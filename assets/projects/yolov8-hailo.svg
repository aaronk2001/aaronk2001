<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="800" height="500" fill="#0b0f14"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<text x="32" y="44" fill="#e2e8f0" font-size="16" font-weight="bold">yolov8-hailo-pi5</text>
<text x="32" y="66" fill="#64748b" font-size="11">Raspberry Pi 5 (16 GB) + Hailo-8 AI HAT+ (26 TOPS, PCIe)</text>
<rect x="32" y="100" width="160" height="70" rx="10" fill="#0b1220" stroke="#1e293b"/>
<text x="112" y="130" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Capture</text>
<text x="112" y="150" text-anchor="middle" fill="#64748b" font-size="10">thread 1, shared frame</text>
<path d="M192 135 L220 135" stroke="#64748b" marker-end="url(#arr)"/>
<rect x="222" y="100" width="160" height="70" rx="10" fill="#0b1220" stroke="#0ea5e9"/>
<text x="302" y="130" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Hailo-8</text>
<text x="302" y="150" text-anchor="middle" fill="#64748b" font-size="10">yolov8n.hef, 640x640</text>
<path d="M382 135 L410 135" stroke="#64748b" marker-end="url(#arr)"/>
<rect x="412" y="100" width="160" height="70" rx="10" fill="#0b1220" stroke="#1e293b"/>
<text x="492" y="130" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">NMS decode</text>
<text x="492" y="150" text-anchor="middle" fill="#64748b" font-size="10">postprocess.py</text>
<path d="M572 135 L600 135" stroke="#64748b" marker-end="url(#arr)"/>
<rect x="602" y="100" width="160" height="70" rx="10" fill="#0b1220" stroke="#1e293b"/>
<text x="682" y="130" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">ByteTrack</text>
<text x="682" y="150" text-anchor="middle" fill="#64748b" font-size="10">IDs across frames</text>
<text x="32" y="222" fill="#94a3b8" font-size="12" font-weight="bold">measured on the Pi, 2026-09-25</text>
<text x="32" y="240" fill="#475569" font-size="10">500 synthetic 640x640 frames after 10 warmup, sequential single-frame</text>
<text x="300" y="266" text-anchor="end" fill="#64748b" font-size="10">activate per frame</text>
<text x="436" y="266" text-anchor="end" fill="#64748b" font-size="10">activate once</text>
<rect x="32" y="274" width="420" height="30" rx="6" fill="#0b1220" stroke="#1e293b"/>
<text x="48" y="294" fill="#94a3b8" font-size="12">throughput</text>
<text x="300" y="294" text-anchor="end" fill="#64748b" font-size="12">80.99 FPS</text>
<text x="436" y="294" text-anchor="end" fill="#38bdf8" font-size="15" font-weight="bold">144.74 FPS</text>
<rect x="32" y="308" width="420" height="30" rx="6" fill="#0b1220" stroke="#1e293b"/>
<text x="48" y="328" fill="#94a3b8" font-size="12">latency p50</text>
<text x="300" y="328" text-anchor="end" fill="#64748b" font-size="12">12.06 ms</text>
<text x="436" y="328" text-anchor="end" fill="#e2e8f0" font-size="12" font-weight="bold">6.84 ms</text>
<rect x="32" y="342" width="420" height="30" rx="6" fill="#0b1220" stroke="#1e293b"/>
<text x="48" y="362" fill="#94a3b8" font-size="12">latency p95</text>
<text x="300" y="362" text-anchor="end" fill="#64748b" font-size="12">13.10 ms</text>
<text x="436" y="362" text-anchor="end" fill="#e2e8f0" font-size="12" font-weight="bold">7.31 ms</text>
<rect x="32" y="376" width="420" height="30" rx="6" fill="#0b1220" stroke="#1e293b"/>
<text x="48" y="396" fill="#94a3b8" font-size="12">latency p99</text>
<text x="300" y="396" text-anchor="end" fill="#64748b" font-size="12">15.47 ms</text>
<text x="436" y="396" text-anchor="end" fill="#e2e8f0" font-size="12" font-weight="bold">7.95 ms</text>
<text x="490" y="290" fill="#64748b" font-size="10.5">Fix: activate the network group and</text>
<text x="490" y="306" fill="#64748b" font-size="10.5">open InferVStreams once at startup,</text>
<text x="490" y="322" fill="#64748b" font-size="10.5">not on every frame. 1.8x throughput.</text>
<text x="490" y="354" fill="#64748b" font-size="10.5">Live USB webcam: 15.0 FPS for 60 s,</text>
<text x="490" y="370" fill="#64748b" font-size="10.5">every frame inferred (camera-bound).</text>
</svg>
