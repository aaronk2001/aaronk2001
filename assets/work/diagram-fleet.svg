<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="838" height="523" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="40" y="62" fill="#86a8c8" font-size="20" font-weight="600" letter-spacing="2">FLEET CONTROL LOOP</text>
  <text x="40" y="94" fill="#8b949e" font-size="20">Same software on every machine</text>

  <!-- Inputs -->
  <rect x="30" y="140" width="230" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="145" y="188" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Cloud job queue</text>
  <text x="145" y="222" text-anchor="middle" fill="#8b949e" font-size="20">pulled over WiFi</text>

  <rect x="30" y="290" width="230" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="145" y="338" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Barcode scan</text>
  <text x="145" y="372" text-anchor="middle" fill="#8b949e" font-size="20">one scan starts a job</text>

  <!-- Controller -->
  <rect x="305" y="140" width="230" height="260" rx="12" fill="#161b22" stroke="#86a8c8" stroke-width="2.5"/>
  <text x="420" y="228" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Python</text>
  <text x="420" y="262" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">control app</text>
  <text x="420" y="306" text-anchor="middle" fill="#8b949e" font-size="20">multi-threaded</text>
  <text x="420" y="334" text-anchor="middle" fill="#8b949e" font-size="20">autonomous jobs</text>

  <!-- Outputs -->
  <rect x="580" y="140" width="230" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="695" y="188" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Pen + paper</text>
  <text x="695" y="222" text-anchor="middle" fill="#8b949e" font-size="20">writing mechanism</text>

  <rect x="580" y="290" width="230" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="695" y="338" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">AWS status</text>
  <text x="695" y="372" text-anchor="middle" fill="#8b949e" font-size="20">live OEE tracking</text>

  <line x1="262" y1="195" x2="301" y2="195" stroke="#6e7681" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="262" y1="345" x2="301" y2="345" stroke="#6e7681" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="537" y1="195" x2="576" y2="195" stroke="#6e7681" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="537" y1="345" x2="576" y2="345" stroke="#6e7681" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Fleet strip -->
  <line x1="30" y1="440" x2="810" y2="440" stroke="#30363d" stroke-width="2"/>
  <g fill="#86a8c8">
    <rect x="40" y="466" width="22" height="30" rx="4"/>
    <rect x="70" y="466" width="22" height="30" rx="4" opacity="0.75"/>
    <rect x="100" y="466" width="22" height="30" rx="4" opacity="0.5"/>
    <rect x="130" y="466" width="22" height="30" rx="4" opacity="0.3"/>
  </g>
  <text x="172" y="490" fill="#e6edf3" font-size="22" font-weight="600">x 200+ machines in production</text>
  <text x="800" y="490" text-anchor="end" fill="#8b949e" font-size="20">30,000 letters/day</text>
</svg>
