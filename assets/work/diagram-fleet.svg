<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="20" y="100" width="150" height="64" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="95" y="128" text-anchor="middle" fill="#cbd5e1" font-size="13">Single barcode</text>
  <text x="95" y="146" text-anchor="middle" fill="#cbd5e1" font-size="13">scan</text>

  <rect x="230" y="92" width="200" height="80" rx="10" fill="#0b1220" stroke="#0ea5e9"/>
  <text x="330" y="122" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Python control app</text>
  <text x="330" y="140" text-anchor="middle" fill="#64748b" font-size="11">multi-threaded · on every robot</text>
  <text x="330" y="156" text-anchor="middle" fill="#64748b" font-size="11">autonomous job execution</text>

  <rect x="490" y="100" width="180" height="64" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="580" y="128" text-anchor="middle" fill="#cbd5e1" font-size="13">Writing mechanism</text>
  <text x="580" y="146" text-anchor="middle" fill="#64748b" font-size="11">+ paper handling</text>

  <rect x="720" y="100" width="120" height="64" rx="10" fill="#0b1220" stroke="#22c55e"/>
  <text x="780" y="128" text-anchor="middle" fill="#cbd5e1" font-size="13">30,000</text>
  <text x="780" y="146" text-anchor="middle" fill="#64748b" font-size="11">letters / day</text>

  <line x1="170" y1="132" x2="226" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="132" x2="486" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="670" y1="132" x2="716" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Cloud above -->
  <rect x="230" y="16" width="200" height="44" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="330" y="36" text-anchor="middle" fill="#cbd5e1" font-size="13">Cloud job queue</text>
  <text x="330" y="52" text-anchor="middle" fill="#64748b" font-size="11">dynamic job pulling · WiFi</text>
  <line x1="330" y1="60" x2="330" y2="88" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- AWS below -->
  <rect x="230" y="216" width="200" height="44" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="330" y="236" text-anchor="middle" fill="#cbd5e1" font-size="13">AWS status feed</text>
  <text x="330" y="252" text-anchor="middle" fill="#64748b" font-size="11">live machine status → OEE</text>
  <line x1="330" y1="172" x2="330" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="20" y="288" fill="#475569" font-size="11">× 200+ machines in production</text>
</svg>
