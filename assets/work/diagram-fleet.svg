<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Fleet control loop: cloud job queue and barcode scan feed a Python control app on each machine, which drives the writing mechanism and reports status to AWS">
<title>Fleet control loop: cloud job queue and barcode scan feed a Python control app on each machine, which drives the writing mechanism and reports status to AWS</title>
<style>

.flow { stroke-dasharray: 7 7; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -14; } }
.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
.led { animation: led 1.6s steps(1) infinite; }
@keyframes led { 50% { opacity: 0.25; } }
.fill { transform-box: fill-box; transform-origin: left; animation: fill 6s ease-out infinite; }
@keyframes fill { 0% { transform: scaleX(0); } 30%, 100% { transform: scaleX(1); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#21262d"/></pattern>
  <radialGradient id="glow" cx="0.2" cy="0" r="0.9"><stop offset="0" stop-color="#86a8c8" stop-opacity="0.18"/><stop offset="1" stop-color="#86a8c8" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="838" height="523" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<rect x="1" y="1" width="838" height="523" rx="14" fill="url(#dots)"/>
<rect x="1" y="1" width="838" height="523" rx="14" fill="url(#glow)"/>
  <text x="40" y="62" fill="#86a8c8" font-size="20" font-weight="600" letter-spacing="2">FLEET CONTROL LOOP</text>
  <text x="40" y="94" fill="#8b949e" font-size="20">Same software on every machine</text>
  <rect x="30" y="140" width="230" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="145" y="189" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Cloud job queue</text>
  <text x="145" y="225" text-anchor="middle" fill="#8b949e" font-size="20">pulled over WiFi</text>
  <rect x="30" y="290" width="230" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="145" y="339" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Barcode scan</text>
  <text x="145" y="375" text-anchor="middle" fill="#8b949e" font-size="20">one scan starts a job</text>
  <rect x="305" y="140" width="230" height="260" rx="12" fill="#161b22" stroke="#86a8c8" stroke-width="2.5" class="pulse"/>
  <text x="420" y="234" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Python</text>
  <text x="420" y="266" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">control app</text>
  <text x="420" y="302" text-anchor="middle" fill="#8b949e" font-size="20">multi-threaded</text>
  <text x="420" y="330" text-anchor="middle" fill="#8b949e" font-size="20">autonomous jobs</text>
  <rect x="580" y="140" width="230" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="695" y="189" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Pen + paper</text>
  <text x="695" y="225" text-anchor="middle" fill="#8b949e" font-size="20">writing mechanism</text>
  <rect x="580" y="290" width="230" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="695" y="339" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">AWS status</text>
  <text x="695" y="375" text-anchor="middle" fill="#8b949e" font-size="20">live OEE tracking</text>
  <line x1="262" y1="195" x2="301" y2="195" stroke="#6e7681" stroke-width="2.5" class="flow" marker-end="url(#arr)"/>
  <line x1="262" y1="345" x2="301" y2="345" stroke="#6e7681" stroke-width="2.5" class="flow" marker-end="url(#arr)"/>
  <line x1="537" y1="195" x2="576" y2="195" stroke="#6e7681" stroke-width="2.5" class="flow" marker-end="url(#arr)"/>
  <line x1="537" y1="345" x2="576" y2="345" stroke="#6e7681" stroke-width="2.5" class="flow" marker-end="url(#arr)"/>
  <line x1="30" y1="440" x2="810" y2="440" stroke="#30363d" stroke-width="2"/>
  <rect x="40" y="466" width="22" height="30" rx="4" fill="#86a8c8" opacity="1" class="led" style="animation-delay:0s"/>
  <rect x="70" y="466" width="22" height="30" rx="4" fill="#86a8c8" opacity="0.78" class="led" style="animation-delay:0.4s"/>
  <rect x="100" y="466" width="22" height="30" rx="4" fill="#86a8c8" opacity="0.56" class="led" style="animation-delay:0.8s"/>
  <rect x="130" y="466" width="22" height="30" rx="4" fill="#86a8c8" opacity="0.33999999999999997" class="led" style="animation-delay:1.2000000000000002s"/>
  <text x="172" y="490" fill="#e6edf3" font-size="22" font-weight="600">x 200+ machines in production</text>
  <text x="800" y="490" text-anchor="end" fill="#8b949e" font-size="20">30,000 letters/day</text>
</svg>
