<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="20" y="80" width="130" height="64" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="85" y="108" text-anchor="middle" fill="#cbd5e1" font-size="13">Letter</text>
  <text x="85" y="126" text-anchor="middle" fill="#cbd5e1" font-size="13">infeed</text>

  <rect x="200" y="72" width="190" height="80" rx="10" fill="#0b1220" stroke="#0ea5e9"/>
  <text x="295" y="102" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">PLC sequencing</text>
  <text x="295" y="120" text-anchor="middle" fill="#64748b" font-size="11">ladder logic · sensors</text>
  <text x="295" y="136" text-anchor="middle" fill="#64748b" font-size="11">insertion handling</text>

  <rect x="440" y="72" width="180" height="80" rx="10" fill="#0b1220" stroke="#0ea5e9"/>
  <text x="530" y="102" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Vision QA</text>
  <text x="530" y="120" text-anchor="middle" fill="#64748b" font-size="11">YOLO inspection</text>
  <text x="530" y="136" text-anchor="middle" fill="#64748b" font-size="11">accept / reject</text>

  <rect x="690" y="40" width="150" height="56" rx="10" fill="#0b1220" stroke="#22c55e"/>
  <text x="765" y="64" text-anchor="middle" fill="#cbd5e1" font-size="13">Package &amp; ship</text>
  <text x="765" y="82" text-anchor="middle" fill="#64748b" font-size="11">$100K+/yr labor saved</text>

  <rect x="690" y="140" width="150" height="56" rx="10" fill="#0b1220" stroke="#ef4444"/>
  <text x="765" y="164" text-anchor="middle" fill="#cbd5e1" font-size="13">Reject / rework</text>
  <text x="765" y="182" text-anchor="middle" fill="#64748b" font-size="11">real-time inspection</text>

  <line x1="150" y1="112" x2="196" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="112" x2="436" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="96" x2="686" y2="72" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="128" x2="686" y2="164" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="632" y="64" fill="#22c55e" font-size="11">pass</text>
  <text x="632" y="168" fill="#ef4444" font-size="11">fail</text>

  <text x="20" y="236" fill="#475569" font-size="11">Designed, built &amp; programmed in-house — on Arduino Opta + Portenta PLCs</text>
