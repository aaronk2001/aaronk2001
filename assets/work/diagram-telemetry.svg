<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- fleet stack -->
  <rect x="28" y="88" width="140" height="64" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <rect x="24" y="84" width="140" height="64" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="80" width="140" height="64" rx="10" fill="#0b1220" stroke="#0ea5e9"/>
  <text x="90" y="108" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">200+ machines</text>
  <text x="90" y="126" text-anchor="middle" fill="#64748b" font-size="11">live status · WiFi</text>

  <rect x="220" y="80" width="150" height="64" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="295" y="108" text-anchor="middle" fill="#cbd5e1" font-size="13">AWS ingest</text>
  <text x="295" y="126" text-anchor="middle" fill="#64748b" font-size="11">per-machine status</text>

  <rect x="430" y="80" width="150" height="64" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="505" y="108" text-anchor="middle" fill="#cbd5e1" font-size="13">SQL pipeline</text>
  <text x="505" y="126" text-anchor="middle" fill="#64748b" font-size="11">processing + history</text>

  <rect x="640" y="72" width="200" height="80" rx="10" fill="#0b1220" stroke="#22c55e"/>
  <text x="740" y="100" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">OEE metrics</text>
  <text x="740" y="118" text-anchor="middle" fill="#64748b" font-size="11">availability =</text>
  <text x="740" y="134" text-anchor="middle" fill="#64748b" font-size="11">available ÷ total machines</text>

  <line x1="160" y1="112" x2="216" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="112" x2="426" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="112" x2="636" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Prometheus/Grafana branch -->
  <rect x="220" y="196" width="220" height="56" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <text x="330" y="220" text-anchor="middle" fill="#cbd5e1" font-size="13">Prometheus fault detection</text>
  <text x="330" y="238" text-anchor="middle" fill="#64748b" font-size="11">scrapes machine + service metrics</text>

  <rect x="520" y="196" width="200" height="56" rx="10" fill="#0b1220" stroke="#0ea5e9"/>
  <text x="620" y="220" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Grafana + alerts</text>
  <text x="620" y="238" text-anchor="middle" fill="#64748b" font-size="11">MTTR 10h → 3.5h</text>

  <line x1="90" y1="144" x2="90" y2="224 " stroke="#64748b" stroke-width="1.5"/>
  <line x1="90" y1="224" x2="216" y2="224" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="224" x2="516" y2="224" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
