<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pi 5 and Hailo-8L pipeline from camera to YOLOv8n to ByteTrack, with throughput rising from 81 to 145 FPS after the fix">
<title>Pi 5 and Hailo-8L pipeline from camera to YOLOv8n to ByteTrack, with throughput rising from 81 to 145 FPS after the fix</title>
<style>

.flow { stroke-dasharray: 7 7; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -14; } }
.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.35; } }
.led { animation: led 1.6s steps(1) infinite; }
@keyframes led { 50% { opacity: 0.25; } }
.fill { transform-box: fill-box; transform-origin: left; animation: fill 6s ease-out infinite; }
@keyframes fill { 0% { transform: scaleX(0); } 30%, 100% { transform: scaleX(1); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#21262d"/></pattern>
  <radialGradient id="glow" cx="0.2" cy="0" r="0.9"><stop offset="0" stop-color="#86a8c8" stop-opacity="0.18"/><stop offset="1" stop-color="#86a8c8" stop-opacity="0"/></radialGradient>
</defs>
<rect x="1" y="1" width="838" height="523" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<rect x="1" y="1" width="838" height="523" rx="14" fill="url(#dots)"/>
<rect x="1" y="1" width="838" height="523" rx="14" fill="url(#glow)"/>
  <text x="40" y="62" fill="#86a8c8" font-size="20" font-weight="600" letter-spacing="2">EDGE INFERENCE</text>
  <text x="40" y="94" fill="#8b949e" font-size="20">Raspberry Pi 5 + Hailo-8L NPU, 13 TOPS</text>
  <rect x="30" y="130" width="230" height="100" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="145" y="174" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Camera</text>
  <text x="145" y="210" text-anchor="middle" fill="#8b949e" font-size="20">threaded capture</text>
  <rect x="305" y="130" width="230" height="100" rx="12" fill="#161b22" stroke="#86a8c8" stroke-width="2.5" class="pulse"/>
  <text x="420" y="174" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">Hailo-8L</text>
  <text x="420" y="210" text-anchor="middle" fill="#8b949e" font-size="20">YOLOv8n + NMS</text>
  <rect x="580" y="130" width="230" height="100" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="695" y="174" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="600">ByteTrack</text>
  <text x="695" y="210" text-anchor="middle" fill="#8b949e" font-size="20">IDs across frames</text>
  <line x1="262" y1="180" x2="301" y2="180" stroke="#6e7681" stroke-width="2.5" class="flow" marker-end="url(#arr)"/>
  <line x1="537" y1="180" x2="576" y2="180" stroke="#6e7681" stroke-width="2.5" class="flow" marker-end="url(#arr)"/>
  <text x="40" y="290" fill="#8b949e" font-size="20">Before fix</text>
  <rect x="200" y="268" width="314" height="30" rx="6" fill="#30363d" class="fill"/>
  <text x="528" y="291" fill="#8b949e" font-size="22">81 FPS</text>
  <text x="40" y="352" fill="#e6edf3" font-size="20" font-weight="600">After fix</text>
  <rect x="200" y="330" width="560" height="30" rx="6" fill="#86a8c8" class="fill"/>
  <text x="748" y="353" text-anchor="end" fill="#0d1117" font-size="22" font-weight="700">145 FPS</text>
  <text x="40" y="404" fill="#8b949e" font-size="20">Network group opened once at startup, not on every frame</text>
  <line x1="30" y1="440" x2="810" y2="440" stroke="#30363d" stroke-width="2"/>

  <text x="40" y="490" fill="#e6edf3" font-size="22" font-weight="600">p50 latency 12.06 ms to 6.84 ms</text>
  <text x="800" y="490" text-anchor="end" fill="#8b949e" font-size="20">640x640, on-device</text>
</svg>
