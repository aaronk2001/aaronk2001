.pin { opacity: 0; animation: pin 9s infinite; }
@keyframes pin { 0%, 20% { opacity: 0; } 26%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pin { opacity: 1; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
