<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Timeline: B.S.E. Robotics at Arizona State, graduated Dec 2024. LANL glovebox capstone Aug 2023 to Apr 2024. Handwrytten intern Sep 2023 to Jun 2024, promoted to Robotics Engineer II, through Sep 2026.">
